<!-- Pando v1 brand fonts: Space Grotesk (display/headings/wordmark) and
     JetBrains Mono (code), loaded from Google Fonts. See assets/css/custom.css
     for how --font-display / --font-mono-brand are applied. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<!-- Bosque (brand background/ink) as the browser UI theme color, per color scheme. -->
<meta name="theme-color" content="#fdfcf8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c1f18" media="(prefers-color-scheme: dark)" />
