# Pando features by stratum. Drives the home page chips and counts, the
# docs sidebar and the features index.
#
#   slug  page under content/<lang>/docs/features/<slug>.md  → counts as a feature
#   ref   any other site page (e.g. /docs/mcp)                → plain link chip
#   none  static chip (providers, protocols…)
#   en / es  chip label; es falls back to en.
#
# When you add a page under docs/features/, add its entry here. The build
# fails if a slug has no page.

