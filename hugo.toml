# ── Site params ───────────────────────────────────────────────
[params]
  version = "1.x"
  github = "https://github.com/digiogithub/pando"
  description = "Asistente IA terminal para desarrolladores — potente, extensible y open source"

  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/brand/pando-mark-dark.svg"
      dark = "images/brand/pando-mark-light.svg"
      width  = "28"
      height = "28"

  [params.footer]
    displayCopyright = true
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"

  [params.editURL]
    enable = true
    base = "https://github.com/madeindigio/pando-docs/edit/main/content"

  # Feedback target for the "Was this guide helpful?" block.
  [params.feedback]
    issues = "https://github.com/madeindigio/pando-docs/issues/new"

  [params.blog]
    [params.blog.list]
      displayTags = true
      sortBy = "date"
      sortOrder = "desc"
      pagerSize = 10

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
