baseURL = "https://docs.pando.dev/"
title = "Pando"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Pando"
    contentDir = "content/en"
  [languages.es]
    languageName = "Español"
    weight = 2
    title = "Pando"
    contentDir = "content/es"

# ── Navigation menu ───────────────────────────────────────────
# Labels are translated by identifier in i18n/*.yaml; `name` is the fallback.
[[menus.main]]
  identifier = "docs"
  name = "Docs"
  pageRef = "/docs"
  weight = 1

[[menus.main]]
  identifier = "guides"
  name = "Guides"
  pageRef = "/guides"
  weight = 2

[[menus.main]]
